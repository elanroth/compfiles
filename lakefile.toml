name = "compfiles"
defaultTargets = ["ProblemExtraction", "Compfiles", "Elan", "buildWebpage", "extractProblems", "checkSolution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true
weak.linter.tacticAnalysis.tryAtEachStepFromEnv = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[require]]
name = "tryAtEachStep"
git = "https://github.com/dwrensha/tryAtEachStep"
rev = "main"

[[lean_lib]]
name = "SSG"

[[lean_lib]]
name = "Dashboard"

[[lean_lib]]
name = "ProblemExtraction"

[[lean_lib]]
name = "Compfiles"

# Elan's working area. Fork-local: do not include in an upstream PR.
# Built so the P5 prove/integrate/verify cycle has a real build gate.
# See Elan.lean for the four modules excluded pending proof maintenance.
[[lean_lib]]
name = "Elan"

[[lean_exe]]
name = "buildWebpage"
root = "scripts.buildWebpage"
supportInterpreter = true

[[lean_exe]]
name = "extractProblems"
root = "scripts.extractProblems"
supportInterpreter = true

[[lean_exe]]
name = "checkSolution"
root = "scripts.checkSolution"
supportInterpreter = true
